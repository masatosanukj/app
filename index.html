<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>マイアプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff5f7; --card:#fff; --ink:#5a4a52; --ink-soft:#a8959e;
    --pink:#ff8fab; --pink-deep:#ff5d8f; --mint:#7fd1c4; --yellow:#ffd56b;
    --lav:#b8a4e3; --blue:#8ec5ff; --line:#ffe3ea;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:500;color:var(--ink);
    background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;
    padding:0 0 40px;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;background-color:#fff5f7;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,213,107,.12) 0 18px, transparent 19px),
      radial-gradient(circle at 88% 30%, rgba(143,209,196,.13) 0 16px, transparent 17px),
      radial-gradient(circle at 25% 75%, rgba(184,164,227,.12) 0 20px, transparent 21px),
      radial-gradient(circle at 75% 88%, rgba(255,143,171,.12) 0 16px, transparent 17px);
    background-size:240px 240px;
  }
  .head{
    text-align:center;padding:34px 16px 22px;
  }
  .head .bow{font-size:30px;}
  .head h1{
    font-family:'Mochiy Pop One',sans-serif;font-size:26px;color:var(--pink-deep);
    letter-spacing:.04em;margin-top:6px;
    text-shadow:1px 1px 0 #fff,2px 2px 0 var(--line);
  }
  .head p{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin-top:8px;}

  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}
  .grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:460px){.grid{grid-template-columns:1fr 1fr;}}

  .card{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
    background:var(--card);border:2.5px solid var(--line);border-radius:22px;
    padding:16px 16px;box-shadow:0 4px 0 var(--line);
    transition:transform .14s, box-shadow .14s;position:relative;
  }
  .card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
  .card .ic{
    width:52px;height:52px;flex:0 0 auto;border-radius:16px;
    display:flex;align-items:center;justify-content:center;font-size:28px;
  }
  .card .tx{flex:1;min-width:0;}
  .card .tx .nm{font-family:'Mochiy Pop One',sans-serif;font-size:15px;line-height:1.3;}
  .card .tx .ds{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:4px;line-height:1.4;}
  .card .go{font-size:18px;color:var(--pink-deep);flex:0 0 auto;}

  .card.c-shop{border-color:var(--pink);box-shadow:0 4px 0 #ffc6d4;}
  .card.c-shop .ic{background:#fff0f4;}
  .card.c-skin{border-color:var(--mint);box-shadow:0 4px 0 #c2ece5;}
  .card.c-skin .ic{background:#eefaf8;}
  .card.c-ivf{border-color:var(--lav);box-shadow:0 4px 0 #ded3f2;}
  .card.c-ivf .ic{background:#f4f0fb;}

  .card.soon{cursor:default;opacity:.7;}
  .card.soon:active{transform:none;box-shadow:0 4px 0 var(--line);}
  .card.soon .go{display:none;}
  .badge{
    position:absolute;top:-9px;right:14px;
    font-family:'Mochiy Pop One',sans-serif;font-size:10px;color:#fff;
    background:var(--ink-soft);border:2px solid #fff;border-radius:12px;padding:2px 9px;
  }

  .foot{text-align:center;margin-top:26px;font-size:11px;color:var(--ink-soft);font-weight:700;line-height:1.7;}
</style>
</head>
<body>
  <div class="head">
    <div class="bow">🎀</div>
    <h1>マイアプリ</h1>
    <p>使いたいツールをえらんでね</p>
  </div>

  <div class="wrap">
    <div class="grid">

      <a class="card c-shop" href="shopping.html">
        <span class="ic">🛒</span>
        <span class="tx">
          <span class="nm">おかいものリスト</span>
          <span class="ds">買い物カゴの金額計算・冷蔵庫管理・購入履歴</span>
        </span>
        <span class="go">›</span>
      </a>

      <div class="card c-skin soon">
        <span class="badge">準備中</span>
        <span class="ic">🧴</span>
        <span class="tx">
          <span class="nm">スキンケア</span>
          <span class="ds">毎日のスキンケア手順チェック</span>
        </span>
      </div>

      <div class="card c-ivf soon">
        <span class="badge">準備中</span>
        <span class="ic">💉</span>
        <span class="tx">
          <span class="nm">費用シミュレータ</span>
          <span class="ds">治療費の見積もりシミュレーション</span>
        </span>
      </div>

    </div>

    <div class="foot">
      masatosanukj.github.io/app<br>
      ツールが増えたらここにカードを追加していけます
    </div>
  </div>
</body>
</html>
